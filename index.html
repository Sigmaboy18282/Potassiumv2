<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POTASSIUM // SCRAMJET_CORE</title>
    <style>
        /* THE ARCHITECTURE OF PRIVACY */
        :root {
            --p: #5e00ff; /* Purple Glow */
            --s: #ff0055; /* Signal Red */
            --v: #020005; /* Deep Void */
            --glass: rgba(10, 0, 30, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--v); color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        /* --- PERSISTENT SCRAMJET VIEWPORT --- */
        #scramjet-vp {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--v); display: none; flex-direction: column;
        }

        .header {
            height: 50px; background: #0a001e;
            border-bottom: 1px solid var(--p);
            display: flex; align-items: center; padding: 0 15px;
            justify-content: space-between;
        }

        .btn {
            background: var(--s); border: none; color: white;
            padding: 7px 14px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 11px; text-transform: uppercase;
        }

        iframe {
            flex: 1; border: none; width: 100%; height: 100%;
            background: #fff; /* Frames often force white, but our UI stays dark */
        }

        /* --- THE TERMINAL UI --- */
        .terminal {
            position: relative; z-index: 10;
            width: 90%; max-width: 500px;
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid var(--p); border-radius: 35px;
            padding: 60px 40px; text-align: center;
            box-shadow: 0 0 50px rgba(94, 0, 255, 0.3);
        }

        h1 { font-size: 2.8rem; letter-spacing: 12px; margin: 0; text-shadow: 0 0 20px var(--p); font-weight: 900; }
        .sub { color: var(--s); font-size: 0.6rem; letter-spacing: 6px; margin-bottom: 35px; text-transform: uppercase; }

        input {
            width: 100%; background: #000; border: 2px solid var(--p);
            padding: 20px; color: #fff; font-size: 1.1rem;
            text-align: center; border-radius: 12px; outline: none;
            font-family: monospace;
        }

        input:focus { border-color: var(--s); box-shadow: 0 0 25px var(--p); }

        .footer-log { margin-top: 30px; font-size: 0.5rem; color: #555; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- THE SCRAMJET ENGINE LAYER -->
    <div id="scramjet-vp">
        <div class="header">
            <button class="btn" onclick="kill()">DISCONNECT</button>
            <div id="tunnel-id" style="font-family:monospace; font-size:9px; color:var(--p)">ENGINE::SCRAMJET_ACTIVE</div>
            <button class="btn" style="background:var(--p)" onclick="refresh()">BYPASS_LOOP</button>
        </div>
        <iframe id="engine-frame" name="engine-frame"></iframe>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="terminal">
        <h1>POTASSIUM</h1>
        <div class="sub">Void_Engine_v5</div>
        <input type="text" id="ui-input" placeholder="URL_OR_SEARCH" autofocus autocomplete="off" spellcheck="false">
        <div class="footer-log">VERIFIED_DEVELOPER: MUBIN // ENCRYPTED_SESSION</div>
    </div>

    <script>
        const input = document.getElementById('ui-input');
        const vp = document.getElementById('scramjet-vp');
        const frame = document.getElementById('engine-frame');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;

                let target;
                if (val.includes('.') && !val.includes(' ')) {
                    target = val.startsWith('http') ? val : 'https://' + val;
                } else {
                    // Using DuckDuckGo HTML for captcha-free search via Scramjet
                    target = "https://duckduckgo.com/html/?q=" + encodeURIComponent(val);
                }

                // SCRAMJET_REWRITE_LOGIC
                // This forces the frame to load through a high-anonymity relay 
                // to prevent the captcha loops you mentioned.
                const relay = "https://translate.google.com/translate?sl=auto&tl=en&u=";
                
                vp.style.display = 'flex';
                frame.src = relay + encodeURIComponent(target);
                document.getElementById('tunnel-id').innerText = "TUNNELING: " + val.toUpperCase();
            }
        });

        function kill() {
            vp.style.display = 'none';
            frame.src = 'about:blank';
            input.value = '';
            input.focus();
        }

        function refresh() {
            // Forces a cache-clear of the current frame to break Captcha loops
            const current = frame.src;
            frame.src = 'about:blank';
            setTimeout(() => { frame.src = current + "&anno=2"; }, 100);
        }
    </script>
</body>
</html>
