<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTASSIUM // REAL_SCRAMJET</title>
    <style>
        :root { --p: #5e00ff; --s: #ff0055; --v: #020005; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--v); color: #fff; font-family: sans-serif; overflow: hidden; }
        
        #viewport { position: fixed; inset: 0; z-index: 9999; background: var(--v); display: none; flex-direction: column; }
        .nav { height: 48px; background: #0a001e; border-bottom: 1px solid var(--p); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
        .b { background: var(--s); border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; }
        
        iframe { flex: 1; border: none; background: #fff; }

        .terminal { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        h1 { font-size: 3rem; letter-spacing: 12px; text-shadow: 0 0 25px var(--p); margin: 0; font-weight: 900; }
        input { width: 85%; max-width: 500px; background: #000; border: 2px solid var(--p); padding: 22px; color: #fff; border-radius: 12px; outline: none; margin-top: 20px; font-size: 1.2rem; text-align: center; }
        input:focus { border-color: var(--s); box-shadow: 0 0 25px var(--p); }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="nav">
            <button class="b" onclick="disconnect()">DISCONNECT</button>
            <div id="status" style="color:var(--p); font-family:monospace; font-size:9px;">SCRAMJET_PROTOCOL_V6</div>
            <button class="b" style="background:#444" onclick="location.reload()">REBOOT</button>
        </div>
        <iframe id="scramjet-frame"></iframe>
    </div>

    <div class="terminal">
        <h1>POTASSIUM</h1>
        <div style="font-size:0.6rem; color:var(--s); letter-spacing:8px; margin-bottom:5px;">VOID_ENGINE</div>
        <input type="text" id="target" placeholder="SEARCH_OR_URL" autofocus>
    </div>

    <!-- YOU MUST HAVE THESE FILES ON GITHUB FOR THIS TO WORK -->
    <script src="scramjet.config.js"></script>
    <script src="scramjet.codecs.js"></script>
    
    <script>
        const input = document.getElementById('target');
        const view = document.getElementById('viewport');
        const frame = document.getElementById('scramjet-frame');

        // Scramjet Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { 
                scope: '/potassium-v3/' // Change this to your folder name on GitHub
            });
        }

        input.onkeypress = async (e) => {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;

                let url = val.includes('.') && !val.includes(' ') ? 
                          (val.startsWith('http') ? val : 'https://' + val) : 
                          "https://duckduckgo.com/html/?q=" + encodeURIComponent(val);

                view.style.display = 'flex';
                
                // Real Scramjet Encoding Logic
                try {
                    const encodedUrl = __scramjet$config.prefix + __scramjet$codecs.xor.encode(url);
                    frame.src = encodedUrl;
                } catch (err) {
                    // Fallback if Scramjet scripts aren't loaded yet
                    console.log("Scramjet Engine not loaded. Using fallback.");
                    frame.src = "https://translate.google.com/translate?sl=auto&tl=en&u=" + encodeURIComponent(url);
                }
            }
        };

        function disconnect() {
            view.style.display = 'none';
            frame.src = "about:blank";
            input.value = "";
        }
    </script>
</body>
</html>
