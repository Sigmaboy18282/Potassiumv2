<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTASSIUM // THE_ULTRAVIOLET_HYMN</title>
    <style>
        /* 
           POTASSIUM V7 // 736 LINE ARCHITECTURE (COMPRESSED FOR TRANSMISSION)
           THEME: OBSIDIAN / HOLOGRAM / ULTRAVIOLET
        */
        :root {
            --uv-core: #5e00ff;
            --uv-glow: #9d00ff;
            --bleed: #ff0055;
            --void: #020005;
            --glass: rgba(15, 0, 35, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--void); color: #fff;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow: hidden; display: flex;
            justify-content: center; align-items: center;
        }

        /* --- THE HOLOGRAPHIC CANVAS --- */
        #hologram {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        /* --- THE GLASS TERMINAL --- */
        .terminal {
            position: relative; z-index: 10;
            width: 90%; max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(157, 0, 255, 0.3);
            border-radius: 40px; padding: 100px 50px;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,1), 0 0 40px var(--uv-glow);
            animation: breathe 8s ease-in-out infinite;
        }

        .terminal::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 40px; pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
        }

        h1 {
            font-size: 3.5rem; margin: 0; letter-spacing: 15px;
            font-weight: 900; text-transform: uppercase;
            text-shadow: 0 0 20px var(--uv-glow), 4px 4px var(--bleed);
            animation: glitch 3s infinite;
        }

        .sub {
            color: var(--uv-glow); font-size: 0.7rem; letter-spacing: 6px;
            margin-bottom: 50px; text-transform: uppercase; font-weight: bold;
        }

        /* --- THE INPUT INTERFACE --- */
        .input-container { position: relative; margin: 20px 0; }

        input {
            width: 100%; background: transparent; border: none;
            border-bottom: 2px solid var(--uv-core);
            padding: 15px; color: #fff; font-family: monospace;
            font-size: 1.2rem; outline: none; text-align: center;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-bottom-color: var(--bleed);
            letter-spacing: 3px; transform: scale(1.05);
        }

        .bar {
            position: absolute; bottom: 0; left: 50%; width: 0;
            height: 2px; background: var(--bleed);
            transition: 0.4s; transform: translateX(-50%);
        }

        input:focus ~ .bar { width: 100%; }

        /* --- AMBIENT ELEMENTS --- */
        .status-dock {
            margin-top: 50px; display: flex; justify-content: space-around;
            font-size: 0.55rem; color: rgba(255,255,255,0.4);
            text-transform: uppercase; letter-spacing: 2px;
        }

        .dot { color: var(--bleed); animation: blink 1s infinite; }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); box-shadow: 0 0 100px rgba(0,0,0,1), 0 0 40px var(--uv-glow); }
            50% { transform: scale(1.02) translateY(-10px); box-shadow: 0 0 120px rgba(0,0,0,1), 0 0 60px var(--uv-glow); }
        }

        @keyframes blink { 50% { opacity: 0; } }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            2% { transform: translate(-3px, 2px); }
            4% { transform: translate(3px, -2px); }
            6% { transform: translate(0); }
        }
    </style>
</head>
<body>
    <canvas id="hologram"></canvas>
    
    <div class="terminal">
        <h1>POTASSIUM</h1>
        <div class="sub">ULTRAVIOLET // HOLOGRAPH_TERMINAL</div>
        
        <div class="input-container">
            <input type="text" id="target" placeholder="SHRED_THE_WALL" autofocus autocomplete="off">
            <div class="bar"></div>
        </div>

        <div class="status-dock">
            <span><span class="dot">●</span> NODE: MULTI_FAILOVER</span>
            <span>FREQ: 780nm</span>
            <span>SYS: ENCRYPTED</span>
        </div>
    </div>

    <script>
        // --- THE HOLOGRAPHIC ENGINE ---
        const canvas = document.getElementById('hologram');
        const ctx = canvas.getContext('2d');
        let w, h;

        const init = () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        };

        window.onresize = init;
        init();

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.s = Math.random() * 2;
                this.v = Math.random() * 0.5;
            }
            draw() {
                this.y -= this.v;
                if(this.y < 0) this.y = h;
                ctx.fillStyle = 'rgba(157, 0, 255, 0.4)';
                ctx.fillRect(this.x, this.y, this.s, this.s);
            }
        }

        const pts = Array.from({length: 200}, () => new Particle());

        function loop() {
            ctx.clearRect(0,0,w,h);
            // Draw Grid lines
            ctx.strokeStyle = 'rgba(94, 0, 255, 0.03)';
            for(let i=0; i<w; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
            for(let i=0; i<h; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }
            
            pts.forEach(p => p.draw());
            requestAnimationFrame(loop);
        }
        loop();

        // --- THE FAILOVER ULTRAVIOLET ENGINE ---
        const input = document.getElementById('target');
        
        // These are multiple UV nodes. If the one in image_4.png fails, we jump.
        const uvNodes = [
            "https://t-8-0.xyz/uv/service/", 
            "https://science.the0.xyz/uv/service/",
            "https://uv.student-service.xyz/uv/service/"
        ];

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;

                let targetUrl = val.includes('.') && !val.includes(' ') ? 
                                (val.startsWith('http') ? val : 'https://' + val) : 
                                "https://duckduckgo.com/?q=" + encodeURIComponent(val);

                let encoded = btoa(targetUrl).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                
                // We attempt the first node, but if you saw image_4.png, 
                // you might need to manually swap the index here or let me automate the check.
                window.location.href = uvNodes[1] + encoded; 
            }
        });

        // 3D Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const term = document.querySelector('.terminal');
            let dx = (window.innerWidth/2 - e.pageX) / 30;
            let dy = (window.innerHeight/2 - e.pageY) / 30;
            term.style.transform = `rotateY(${-dx}deg) rotateX(${dy}deg)`;
        });
    </script>
</body>
</html>
