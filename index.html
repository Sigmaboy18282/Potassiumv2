<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTASSIUM // VOID_HYMN</title>
    <style>
        :root {
            --accent: #bc13fe; 
            --bleed: #ff0055;  
            --void: #050505;   
        }

        body {
            background: radial-gradient(circle at center, #1a0033 0%, var(--void) 100%);
            color: white;
            font-family: 'Segoe UI', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(20, 0, 40, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(188, 19, 254, 0.5);
            padding: 60px;
            border-radius: 35px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 1), 0 0 40px rgba(188, 19, 254, 0.3);
            text-align: center;
            width: 85%;
            max-width: 500px;
            z-index: 20;
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 3.2rem;
            margin: 0;
            text-shadow: 5px 5px var(--bleed);
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .sub-text {
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 6px;
            margin-bottom: 45px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 18px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 30px var(--accent);
            border-color: #fff;
            transform: translateY(-2px);
        }

        .status-line {
            margin-top: 35px;
            font-size: 0.75rem;
            color: var(--bleed);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="glass-panel">
        <h1>POTASSIUM</h1>
        <div class="sub-text">PHASE_3_INITIATED</div>
        
        <input type="text" id="target" placeholder="TYPE_URL_OR_SEARCH" autofocus>
        
        <div class="status-line">
            SKELETON_DETECTION: FIXED // BYPASSING_JS_LOCKS
        </div>
    </div>

    <script>
        const input = document.getElementById('target');
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;
                
                // To avoid the image_2.png error, we use a more robust gateway
                // This one handles assets much better than raw CORS proxies
                const gateway = "https://unblock-proxy.com/proxy.php?u=";
                const search = "https://duckduckgo.com/?q=";
                
                let finalUrl;
                if (val.includes('.') && !val.includes(' ')) {
                    finalUrl = val.startsWith('http') ? val : 'https://' + val;
                } else {
                    // Using the Lite version of DDG as a fallback—it's unkillable.
                    finalUrl = "https://duckduckgo.com/lite/?q=" + encodeURIComponent(val);
                }
                
                // Redirection into the tunnel
                window.location.href = gateway + encodeURIComponent(finalUrl);
            }
        });
    </script>
</body>
</html>
