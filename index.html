<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTASSIUM // ULTRAVIOLET_V6</title>
    <style>
        :root {
            --uv-purple: #5e00ff;
            --uv-glow: #9d00ff;
            --bleed: #ff0055;
            --black: #020005;
        }

        body {
            background: radial-gradient(circle at center, #150035 0%, var(--black) 100%);
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-attachment: fixed;
        }

        /* The Ultraviolet Chamber */
        .uv-panel {
            background: rgba(10, 0, 30, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--uv-purple);
            padding: 60px;
            border-radius: 35px;
            box-shadow: 0 0 80px rgba(94, 0, 255, 0.3), inset 0 0 20px rgba(157, 0, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
            animation: float 6s ease-in-out infinite;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 10px;
            font-weight: 900;
            text-shadow: 0 0 15px var(--uv-glow), 4px 4px var(--bleed);
        }

        .tagline {
            color: var(--uv-glow);
            font-size: 0.75rem;
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--uv-purple);
            border-radius: 8px;
            padding: 18px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input:focus {
            border-color: #fff;
            box-shadow: 0 0 40px var(--uv-purple);
            transform: scale(1.02);
        }

        .footer {
            margin-top: 35px;
            font-size: 0.65rem;
            color: var(--bleed);
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Ionizing Noise Overlay */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="uv-panel">
        <h1>POTASSIUM</h1>
        <div class="tagline">SHADOW_SUPPORT_ACTIVE</div>
        
        <input type="text" id="target" placeholder="INITIATE_UV_TUNNEL" autofocus>
        
        <div class="footer">
            ULTRAVIOLET_ENGINE // STATUS: UNBOUND
        </div>
    </div>

    <script>
        const input = document.getElementById('target');
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;
                
                // We are using a robust public Ultraviolet Node as recommended in image_3.png
                // This instance handles the JS rendering to prevent skeleton glitches.
                const uvNode = "https://t-8-0.xyz/uv/service/"; 

                let targetUrl;
                if (val.includes('.') && !val.includes(' ')) {
                    targetUrl = val.startsWith('http') ? val : 'https://' + val;
                } else {
                    targetUrl = "https://duckduckgo.com/?q=" + encodeURIComponent(val);
                }

                // Ultraviolet uses a specific encoding for its proxy paths.
                // We encode the URL in Base64 and format it for the UV service worker.
                let encodedUrl = btoa(targetUrl)
                    .replace(/\//g, '_')
                    .replace(/\+/g, '-')
                    .replace(/=/g, '');

                // Engage the tunnel
                window.location.href = uvNode + encodedUrl;
            }
        });
    </script>
</body>
</html>
