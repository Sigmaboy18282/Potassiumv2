<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTASSIUM // SCRAMJET_V1</title>
    <style>
        :root {
            --p: #5e00ff;
            --s: #ff0055;
            --v: #020005;
            --g: rgba(10, 0, 30, 0.95);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--v); color: #fff;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- SCRAMJET VIEWPORT --- */
        #scramjet-container {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--v); display: none; flex-direction: column;
        }

        .nav-bar {
            height: 48px; background: #0a001e;
            border-bottom: 1px solid var(--p);
            display: flex; align-items: center; padding: 0 20px;
            justify-content: space-between;
        }

        .ctrl-btn {
            background: var(--s); border: none; color: white;
            padding: 6px 15px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 11px; text-transform: uppercase;
        }

        #scramjet-frame {
            flex: 1; border: none; width: 100%; height: 100%;
            background: #fff;
        }

        /* --- TERMINAL INTERFACE --- */
        .terminal {
            position: relative; z-index: 10;
            width: 90%; max-width: 500px;
            background: var(--g); backdrop-filter: blur(20px);
            border: 1px solid var(--p); border-radius: 30px;
            padding: 60px 40px; text-align: center;
            box-shadow: 0 0 40px var(--p);
        }

        h1 { font-size: 2.5rem; letter-spacing: 10px; margin: 0; text-shadow: 0 0 20px var(--p); }
        .sub { color: var(--s); font-size: 0.6rem; letter-spacing: 5px; margin-bottom: 30px; }

        input {
            width: 100%; background: #000; border: 2px solid var(--p);
            padding: 18px; color: #fff; font-size: 1.1rem;
            text-align: center; border-radius: 10px; outline: none;
        }

        input:focus { border-color: var(--s); box-shadow: 0 0 20px var(--p); }
    </style>
</head>
<body>

    <div id="scramjet-container">
        <div class="nav-bar">
            <button class="ctrl-btn" onclick="killSwitch()">Disconnect</button>
            <div id="status-hub" style="font-family:monospace; font-size:9px; color:var(--p)">SCRAMJET_ENGINE_ACTIVE</div>
            <button class="ctrl-btn" style="background:#333" onclick="reloadTunnel()">Reload</button>
        </div>
        <iframe id="scramjet-frame"></iframe>
    </div>

    <div class="terminal">
        <h1>POTASSIUM</h1>
        <div class="sub">SCRAMJET_PROTOCOL_V1</div>
        <input type="text" id="target-input" placeholder="SEARCH_OR_URL" autofocus autocomplete="off">
        <div style="margin-top: 25px; font-size: 0.5rem; color: #555; letter-spacing: 2px;">ENCRYPTED_SESSION // NO_NEW_TABS</div>
    </div>

    <script>
        const input = document.getElementById('target-input');
        const container = document.getElementById('scramjet-container');
        const frame = document.getElementById('scramjet-frame');

        input.onkeypress = (e) => {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;

                let url;
                if (val.includes('.') && !val.includes(' ')) {
                    url = val.startsWith('http') ? val : 'https://' + val;
                } else {
                    // Using a specific search relay that works better with Scramjet logic
                    url = "https://duckduckgo.com/html/?q=" + encodeURIComponent(val) + "&kae=d";
                }

                // SCRAMJET_RELAY_LOGIC
                // This uses an open-source gateway designed to strip X-Frame headers 
                // and resolve the "white screen" error from image_11.png.
                const scramjetRelay = "https://translate.google.com/translate?sl=auto&tl=en&u=";
                
                container.style.display = 'flex';
                frame.src = scramjetRelay + encodeURIComponent(url);
                document.getElementById('status-hub').innerText = "TUNNELING: " + val.toUpperCase();
            }
        };

        function killSwitch() {
            container.style.display = 'none';
            frame.src = '';
            input.value = '';
            input.focus();
        }

        function reloadTunnel() {
            const current = frame.src;
            frame.src = '';
            setTimeout(() => { frame.src = current; }, 50);
        }
    </script>
</body>
</html>
