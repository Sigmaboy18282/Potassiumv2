<!DOCTYPE html>
<html>
<head>
    <title>POTASSIUM // SCRAMJET_V6</title>
    <style>
        :root { --p: #5e00ff; --s: #ff0055; --v: #020005; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--v); color: #fff; font-family: sans-serif; overflow: hidden; }
        #vp { position: fixed; inset: 0; z-index: 9999; background: var(--v); display: none; flex-direction: column; }
        .nav { height: 48px; background: #0a001e; border-bottom: 1px solid var(--p); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
        .btn { background: var(--s); border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; }
        iframe { flex: 1; border: none; background: #fff; }
        .main { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        h1 { font-size: 3rem; letter-spacing: 12px; text-shadow: 0 0 25px var(--p); margin: 0; font-weight: 900; }
        input { width: 85%; max-width: 500px; background: #000; border: 2px solid var(--p); padding: 22px; color: #fff; border-radius: 12px; outline: none; margin-top: 20px; font-size: 1.2rem; text-align: center; }
    </style>
</head>
<body>
    <div id="vp">
        <div class="nav">
            <button class="btn" onclick="location.reload()">DISCONNECT</button>
            <div style="color:var(--p); font-family:monospace; font-size:9px;">SCRAMJET_CORE_ACTIVE</div>
            <button class="btn" style="background:#444" onclick="document.querySelector('iframe').src+=''">RELOAD</button>
        </div>
        <iframe id="ifr"></iframe>
    </div>
    <div class="main">
        <h1>POTASSIUM</h1>
        <input type="text" id="in" placeholder="SEARCH_OR_URL" autofocus>
    </div>
    <script src="scramjet.config.js"></script>
    <script>
        const input = document.getElementById('in');
        const vp = document.getElementById('vp');
        const ifr = document.getElementById('ifr');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' });
        }

        input.onkeypress = async (e) => {
            if (e.key === 'Enter') {
                let url = input.value.trim();
                if (!url.startsWith('http')) url = 'https://' + url;
                vp.style.display = 'flex';
                // Scramjet encoding logic
                ifr.src = __scramjet$config.prefix + btoa(url).replace(/\//g, '_').replace(/\+/g, '-');
            }
        };
    </script>
</body>
</html>
