<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTASSIUM // ULTRA_STAY_DARK</title>
    <style>
        :root {
            --uv-primary: #5e00ff;
            --uv-glow: #9d00ff;
            --bleed: #ff0055;
            --void: #020005;
            --glass-bg: rgba(10, 0, 30, 0.9);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--void); color: #fff;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* --- THE HOLOGRAPHIC BACKGROUND --- */
        #hologram-canvas { position: absolute; inset: 0; z-index: 1; opacity: 0.4; }

        /* --- PERSISTENT PROXY VIEWPORT --- */
        #proxy-container {
            position: fixed; inset: 0; z-index: 1000;
            background: var(--void); display: none; flex-direction: column;
        }

        .proxy-header {
            height: 50px; background: #0a001e; border-bottom: 1px solid var(--uv-primary);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }

        .exit-btn {
            background: var(--bleed); border: none; color: #fff;
            padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        #proxy-frame { flex: 1; border: none; background: #fff; }

        /* --- MAIN TERMINAL UI --- */
        .interface {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 10; perspective: 1000px;
        }

        .terminal {
            background: var(--glass-bg); backdrop-filter: blur(30px);
            border: 1px solid var(--uv-primary); border-radius: 40px;
            padding: 60px 40px; text-align: center; width: 90%; max-width: 550px;
            box-shadow: 0 0 50px var(--uv-glow);
        }

        h1 { font-size: 3rem; letter-spacing: 12px; margin: 0; text-shadow: 0 0 15px var(--uv-glow); }
        .sub { font-size: 0.7rem; color: var(--uv-primary); margin-bottom: 40px; letter-spacing: 4px; }

        input {
            width: 100%; background: rgba(0,0,0,0.8); border: none;
            border-bottom: 2px solid var(--uv-primary); padding: 15px;
            color: #fff; font-size: 1.2rem; text-align: center; outline: none;
        }

        input:focus { border-bottom-color: var(--bleed); box-shadow: 0 5px 15px rgba(157, 0, 255, 0.2); }

        /* --- LOADING OVERLAY --- */
        #loader {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.8); align-items: center; justify-content: center;
            font-family: monospace; color: var(--uv-primary);
        }
    </style>
</head>
<body>

    <canvas id="hologram-canvas"></canvas>

    <div id="loader">INITIALIZING_GHOST_TUNNEL...</div>

    <div id="proxy-container">
        <div class="proxy-header">
            <button class="exit-btn" onclick="closeProxy()">DISCONNECT</button>
            <span id="url-display" style="font-size:0.6rem; color:var(--uv-primary); font-family:monospace;"></span>
            <div style="color: #444; font-size: 0.6rem;">POTASSIUM_V2</div>
        </div>
        <iframe id="proxy-frame"></iframe>
    </div>

    <div class="interface">
        <div class="terminal" id="main-ui">
            <h1>POTASSIUM</h1>
            <div class="sub">BYPASS_ENGINE_STABLE</div>
            <input type="text" id="target" placeholder="TYPE_URL_OR_SEARCH" autofocus autocomplete="off">
            <div style="margin-top: 30px; font-size: 0.5rem; color: var(--bleed);">IF_WHITE_SCREEN_WAIT_5_SECONDS</div>
        </div>
    </div>

    <script>
        // --- ANIMATED BACKGROUND ---
        const canvas = document.getElementById('hologram-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        window.onresize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };

        function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = 'rgba(94, 0, 255, 0.1)';
            for(let i=0; i<w; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
            requestAnimationFrame(draw);
        }
        draw();

        // --- BYPASS LOGIC ---
        const input = document.getElementById('target');
        const container = document.getElementById('proxy-container');
        const frame = document.getElementById('proxy-frame');
        const loader = document.getElementById('loader');
        const urlDisp = document.getElementById('url-display');

        input.onkeypress = (e) => {
            if (e.key === 'Enter') {
                let val = input.value.trim();
                if (!val) return;

                loader.style.display = 'flex';
                
                let dest;
                if (val.includes('.') && !val.includes(' ')) {
                    dest = val.startsWith('http') ? val : 'https://' + val;
                } else {
                    // Using Bing as search mirror because it has fewer captchas than Google
                    dest = "https://www.bing.com/search?q=" + encodeURIComponent(val);
                }

                // PRIMARY RELAY: Google Translate (Most stable for school filters)
                const relay = "https://translate.google.com/translate?sl=auto&tl=en&u=";
                
                frame.src = relay + encodeURIComponent(dest);
                urlDisp.innerText = "TUNNEL_ACTIVE: " + val;

                // Wait for the iframe to load then hide loader
                frame.onload = () => {
                    loader.style.display = 'none';
                    container.style.display = 'flex';
                };
            }
        };

        function closeProxy() {
            container.style.display = 'none';
            frame.src = "";
            input.value = "";
            input.focus();
        }

        // Parallax Move
        document.addEventListener('mousemove', (e) => {
            const term = document.getElementById('main-ui');
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            term.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
</body>
</html>
